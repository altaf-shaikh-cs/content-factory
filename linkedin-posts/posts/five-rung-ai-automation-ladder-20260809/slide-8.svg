<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1350" width="1080" height="1350">
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#EDEAE3"/>
      <stop offset="100%" stop-color="#E4E0D6"/>
    </linearGradient>
  </defs>
  <rect width="1080" height="1350" fill="url(#ground)"/>
  <text x="992" y="148" font-family="'SF Mono', Menlo, 'DejaVu Sans Mono', monospace" font-size="22" font-weight="400" fill="#8A8578" text-anchor="end">8 / 8</text>
  <line x1="88" y1="138" x2="134" y2="138" stroke="#8A8578" stroke-width="3"/>
  <text x="154" y="148" font-family="'SF Mono', Menlo, 'DejaVu Sans Mono', monospace" font-size="23" font-weight="700" fill="#8A8578" letter-spacing="6">BEFORE YOU CLIMB</text>
  <text x="88" y="258" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="54" font-weight="900" fill="#1A1A18">Every rung you climb is</text>
  <text x="88" y="320" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="54" font-weight="900" fill="#1A1A18">maintenance you cannot</text>
  <text x="88" y="382" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="54" font-weight="900" fill="#E14B16">walk away from.</text>
  <text x="88" y="456" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="31" font-weight="400" fill="#1A1A18">A program returns the same output forever.</text>
  <text x="88" y="498" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="31" font-weight="400" fill="#1A1A18">An agent does not.</text>
  <rect x="88" y="556" width="904" height="336" fill="#FFFFFF" rx="18" opacity="0.5"/>
  <text x="128" y="616" font-family="'SF Mono', Menlo, 'DejaVu Sans Mono', monospace" font-size="21" font-weight="900" fill="#8A8578" letter-spacing="2">CLIMB PAST RUNG 2 ONLY IF ALL FOUR ARE TRUE</text>
  <rect x="128" y="646" width="26" height="26" fill="none" rx="6" stroke="#8A8578" stroke-width="3"/>
  <text x="172" y="668" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="28" font-weight="400" fill="#1A1A18">the task repeats at least weekly</text>
  <rect x="128" y="698" width="26" height="26" fill="none" rx="6" stroke="#8A8578" stroke-width="3"/>
  <text x="172" y="720" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="28" font-weight="400" fill="#1A1A18">something can reject bad output on its own</text>
  <rect x="128" y="750" width="26" height="26" fill="none" rx="6" stroke="#8A8578" stroke-width="3"/>
  <text x="172" y="772" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="28" font-weight="400" fill="#1A1A18">the agent can do the work end to end</text>
  <rect x="128" y="802" width="26" height="26" fill="none" rx="6" stroke="#8A8578" stroke-width="3"/>
  <text x="172" y="824" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="28" font-weight="400" fill="#1A1A18">done is objective, not a judgment call</text>
  <text x="128" y="872" font-family="'SF Mono', Menlo, 'DejaVu Sans Mono', monospace" font-size="24" font-weight="700" fill="#E14B16">Miss one and stay on the rung you are on.</text>
  <rect x="88" y="952" width="6" height="152" fill="#E14B16" rx="3"/>
  <text x="122" y="1008" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="44" font-weight="900" fill="#1A1A18">Be honest about the rung you</text>
  <text x="122" y="1058" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="44" font-weight="900" fill="#1A1A18">are on, not the one you talk about.</text>
  <text x="122" y="1120" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="40" font-weight="900" fill="#E14B16">Which one did you try to skip?</text>
  <line x1="88" y1="1196" x2="992" y2="1196" stroke="#D2CEC4" stroke-width="2"/>
  <text x="88" y="1248" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="27" font-weight="700" fill="#1A1A18">Altaf Shaikh</text>
  <text x="88" y="1282" font-family="'SF Mono', Menlo, 'DejaVu Sans Mono', monospace" font-size="20" font-weight="400" fill="#8A8578">// AI Engineering</text>
  <text x="946" y="1244" font-family="'SF Mono', Menlo, 'DejaVu Sans Mono', monospace" font-size="30" font-weight="700" fill="#E14B16" text-anchor="end">@teachmebro</text>
  <text x="946" y="1278" font-family="'SF Mono', Menlo, 'DejaVu Sans Mono', monospace" font-size="18" font-weight="400" fill="#8A8578" text-anchor="end">A rung only holds if the</text>
  <text x="946" y="1302" font-family="'SF Mono', Menlo, 'DejaVu Sans Mono', monospace" font-size="18" font-weight="400" fill="#8A8578" text-anchor="end">one below it is reliable.</text>
  <circle cx="966" cy="1236" r="11" fill="#E14B16"/>
  <circle cx="990" cy="1236" r="11" fill="#1668D6"/>
</svg>
