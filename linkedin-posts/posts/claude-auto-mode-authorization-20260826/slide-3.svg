  <text x="992" y="148" font-family="'SF Mono', Menlo, 'DejaVu Sans Mono', monospace" font-size="22" font-weight="400" fill="#8A8578" text-anchor="end">3 / 12</text>
  <line x1="88" y1="138" x2="134" y2="138" stroke="#8A8578" stroke-width="3"/>
  <text x="154" y="148" font-family="'SF Mono', Menlo, 'DejaVu Sans Mono', monospace" font-size="23" font-weight="700" fill="#8A8578" letter-spacing="6">WHAT ACTUALLY CHANGED</text>
  <text x="88" y="258" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="54" font-weight="900" fill="#1A1A18">They did not remove</text>
  <text x="88" y="318" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="54" font-weight="900" fill="#1A1A18">the check.</text>
  <text x="88" y="418" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="54" font-weight="900" fill="#1A1A18">They replaced</text>
  <text x="88" y="490" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="76" font-weight="900" fill="#E14B16">the reviewer.</text>
  <rect x="88" y="556" width="436" height="226" fill="#DDD9CF" rx="18"/>
  <rect x="88" y="556" width="8" height="226" fill="#8A8578" rx="4"/>
  <text x="124" y="608" font-family="'SF Mono', Menlo, 'DejaVu Sans Mono', monospace" font-size="21" font-weight="900" fill="#8A8578" letter-spacing="3">BEFORE</text>
  <text x="124" y="664" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="36" font-weight="900" fill="#1A1A18">You,</text>
  <text x="124" y="708" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="27" font-weight="400" fill="#1A1A18">at prompt 40,</text>
  <text x="124" y="746" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="27" font-weight="400" fill="#1A1A18">not reading.</text>
  <rect x="556" y="556" width="436" height="226" fill="#C3D8EF" rx="18"/>
  <rect x="556" y="556" width="8" height="226" fill="#1668D6" rx="4"/>
  <text x="592" y="608" font-family="'SF Mono', Menlo, 'DejaVu Sans Mono', monospace" font-size="21" font-weight="900" fill="#8A8578" letter-spacing="3">NOW</text>
  <text x="592" y="664" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="32" font-weight="900" fill="#1A1A18">A second model,</text>
  <text x="592" y="708" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="27" font-weight="400" fill="#1A1A18">every risky action,</text>
  <text x="592" y="746" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="27" font-weight="400" fill="#1A1A18">every time.</text>
  <rect x="78" y="826" width="852" height="78" fill="#F6C9A8" rx="4" opacity="0.95"/>
  <text x="88" y="878" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="42" font-weight="900" fill="#1A1A18">Not to stop a rogue agent.</text>
  <rect x="78" y="914" width="852" height="78" fill="#F6C9A8" rx="4" opacity="0.55"/>
  <text x="88" y="966" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="42" font-weight="900" fill="#1A1A18">To stop a helpful one.</text>
  <text x="88" y="1064" font-family="'SF Mono', Menlo, 'DejaVu Sans Mono', monospace" font-size="29" font-weight="700" fill="#1A1A18">A reviewer that does not get tired at prompt 40.</text>
  <text x="88" y="1106" font-family="'SF Mono', Menlo, 'DejaVu Sans Mono', monospace" font-size="26" font-weight="400" fill="#8A8578">That is the entire change.</text>
