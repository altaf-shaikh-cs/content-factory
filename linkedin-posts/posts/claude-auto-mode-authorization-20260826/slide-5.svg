<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1350" width="1080" height="1350">
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#EDEAE3"/>
      <stop offset="100%" stop-color="#E4E0D6"/>
    </linearGradient>
  </defs>
  <rect width="1080" height="1350" fill="url(#ground)"/>
  <text x="992" y="148" font-family="'SF Mono', Menlo, 'DejaVu Sans Mono', monospace" font-size="22" font-weight="400" fill="#8A8578" text-anchor="end">5 / 12</text>
  <line x1="88" y1="138" x2="134" y2="138" stroke="#8A8578" stroke-width="3"/>
  <text x="154" y="148" font-family="'SF Mono', Menlo, 'DejaVu Sans Mono', monospace" font-size="23" font-weight="700" fill="#8A8578" letter-spacing="6">WHAT THE CLASSIFIER IS FOR</text>
  <text x="88" y="268" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="56" font-weight="900" fill="#1A1A18">It is not reviewing</text>
  <text x="88" y="332" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="56" font-weight="900" fill="#1A1A18">everything you do.</text>
  <text x="88" y="400" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="29" font-weight="400" fill="#8A8578">Most of what Claude does never reaches it at all.</text>
  <rect x="88" y="448" width="904" height="168" fill="#DDD9CF" rx="18"/>
  <rect x="88" y="448" width="8" height="168" fill="#8A8578" rx="4"/>
  <text x="128" y="496" font-family="'SF Mono', Menlo, 'DejaVu Sans Mono', monospace" font-size="21" font-weight="900" fill="#8A8578" letter-spacing="3">TIER 1</text>
  <text x="128" y="544" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="33" font-weight="900" fill="#1A1A18">Reads, searches, navigation</text>
  <text x="128" y="590" font-family="'SF Mono', Menlo, 'DejaVu Sans Mono', monospace" font-size="24" font-weight="400" fill="#8A8578">Never reaches the check. Cannot change state.</text>
  <rect x="88" y="632" width="904" height="168" fill="#C9DCC2" rx="18"/>
  <rect x="88" y="632" width="8" height="168" fill="#8A8578" rx="4"/>
  <text x="128" y="680" font-family="'SF Mono', Menlo, 'DejaVu Sans Mono', monospace" font-size="21" font-weight="900" fill="#8A8578" letter-spacing="3">TIER 2</text>
  <text x="128" y="728" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="33" font-weight="900" fill="#1A1A18">Edits inside your project</text>
  <text x="128" y="774" font-family="'SF Mono', Menlo, 'DejaVu Sans Mono', monospace" font-size="24" font-weight="400" fill="#8A8578">Never reaches it. Git is already your review.</text>
  <rect x="88" y="816" width="904" height="200" fill="#F6D6B8" rx="18"/>
  <rect x="88" y="816" width="8" height="200" fill="#E14B16" rx="4"/>
  <text x="128" y="864" font-family="'SF Mono', Menlo, 'DejaVu Sans Mono', monospace" font-size="21" font-weight="900" fill="#8A8578" letter-spacing="3">TIER 3</text>
  <text x="128" y="912" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="33" font-weight="900" fill="#1A1A18">Shell, network, writes outside</text>
  <text x="128" y="954" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="33" font-weight="900" fill="#1A1A18">the repo, subagent spawns</text>
  <text x="128" y="990" font-family="'SF Mono', Menlo, 'DejaVu Sans Mono', monospace" font-size="24" font-weight="400" fill="#8A8578">This, and only this, is what it reviews.</text>
  <text x="88" y="1076" font-family="'SF Mono', Menlo, 'DejaVu Sans Mono', monospace" font-size="28" font-weight="700" fill="#1A1A18">Only actions with real downside pay for a check.</text>
  <text x="88" y="1116" font-family="'SF Mono', Menlo, 'DejaVu Sans Mono', monospace" font-size="26" font-weight="400" fill="#8A8578">Which is why it feels like nothing changed.</text>
  <line x1="88" y1="1196" x2="992" y2="1196" stroke="#D2CEC4" stroke-width="2"/>
  <text x="88" y="1248" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="27" font-weight="700" fill="#1A1A18">Altaf Shaikh</text>
  <text x="88" y="1282" font-family="'SF Mono', Menlo, 'DejaVu Sans Mono', monospace" font-size="20" font-weight="400" fill="#8A8578">// AI Engineering</text>
  <text x="946" y="1244" font-family="'SF Mono', Menlo, 'DejaVu Sans Mono', monospace" font-size="30" font-weight="700" fill="#E14B16" text-anchor="end">@teachmebro</text>
  <text x="946" y="1278" font-family="'SF Mono', Menlo, 'DejaVu Sans Mono', monospace" font-size="18" font-weight="400" fill="#8A8578" text-anchor="end">Authorization is not</text>
  <text x="946" y="1302" font-family="'SF Mono', Menlo, 'DejaVu Sans Mono', monospace" font-size="18" font-weight="400" fill="#8A8578" text-anchor="end">transitive.</text>
  <circle cx="966" cy="1236" r="11" fill="#E14B16"/>
  <circle cx="990" cy="1236" r="11" fill="#1668D6"/>
</svg>
