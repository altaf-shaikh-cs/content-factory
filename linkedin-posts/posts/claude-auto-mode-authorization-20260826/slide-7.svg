<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1350" width="1080" height="1350">
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#EDEAE3"/>
      <stop offset="100%" stop-color="#E4E0D6"/>
    </linearGradient>
  </defs>
  <rect width="1080" height="1350" fill="url(#ground)"/>
  <text x="992" y="148" font-family="'SF Mono', Menlo, 'DejaVu Sans Mono', monospace" font-size="22" font-weight="400" fill="#8A8578" text-anchor="end">7 / 12</text>
  <line x1="88" y1="138" x2="134" y2="138" stroke="#8A8578" stroke-width="3"/>
  <text x="154" y="148" font-family="'SF Mono', Menlo, 'DejaVu Sans Mono', monospace" font-size="23" font-weight="700" fill="#8A8578" letter-spacing="6">THE QUESTION IT ACTUALLY ASKS</text>
  <text x="88" y="256" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="44" font-weight="900" fill="#8A8578">Not “is this dangerous.”</text>
  <text x="88" y="314" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="44" font-weight="900" fill="#1A1A18">“Did the human authorize this.”</text>
  <text x="88" y="424" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="82" font-weight="900" fill="#1A1A18">Authorization</text>
  <text x="88" y="512" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="82" font-weight="900" fill="#E14B16">is not transitive.</text>
  <rect x="88" y="576" width="904" height="288" fill="#1A1F26" rx="18"/>
  <text x="128" y="632" font-family="'SF Mono', Menlo, 'DejaVu Sans Mono', monospace" font-size="29" font-weight="400" fill="#F2EEE7">“clean up my branches”</text>
  <text x="128" y="674" font-family="'SF Mono', Menlo, 'DejaVu Sans Mono', monospace" font-size="23" font-weight="400" fill="#9AA3AF">&#8594;  git branch -D  (all 14)</text>
  <rect x="776" y="620" width="176" height="44" fill="none" rx="22" stroke="#E14B16" stroke-width="2"/>
  <text x="864" y="650" font-family="'SF Mono', Menlo, 'DejaVu Sans Mono', monospace" font-size="20" font-weight="700" fill="#E14B16" text-anchor="middle" letter-spacing="2">BLOCKED</text>
  <line x1="128" y1="720" x2="952" y2="720" stroke="#2E343F" stroke-width="2" stroke-dasharray="6 7"/>
  <text x="128" y="776" font-family="'SF Mono', Menlo, 'DejaVu Sans Mono', monospace" font-size="29" font-weight="400" fill="#F2EEE7">“can we fix this?”</text>
  <text x="128" y="818" font-family="'SF Mono', Menlo, 'DejaVu Sans Mono', monospace" font-size="23" font-weight="400" fill="#9AA3AF">&#8594;  git push origin main</text>
  <rect x="776" y="764" width="176" height="44" fill="none" rx="22" stroke="#E14B16" stroke-width="2"/>
  <text x="864" y="794" font-family="'SF Mono', Menlo, 'DejaVu Sans Mono', monospace" font-size="20" font-weight="700" fill="#E14B16" text-anchor="middle" letter-spacing="2">BLOCKED</text>
  <text x="88" y="926" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#1A1A18">Related to your goal is not the same</text>
  <text x="88" y="972" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#1A1A18">as approved by you.</text>
  <text x="88" y="1048" font-family="'SF Mono', Menlo, 'DejaVu Sans Mono', monospace" font-size="26" font-weight="400" fill="#8A8578">A question is not a directive.</text>
  <text x="88" y="1092" font-family="'SF Mono', Menlo, 'DejaVu Sans Mono', monospace" font-size="26" font-weight="400" fill="#8A8578">Neither is a goal a permission slip.</text>
  <line x1="88" y1="1196" x2="992" y2="1196" stroke="#D2CEC4" stroke-width="2"/>
  <text x="88" y="1248" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="27" font-weight="700" fill="#1A1A18">Altaf Shaikh</text>
  <text x="88" y="1282" font-family="'SF Mono', Menlo, 'DejaVu Sans Mono', monospace" font-size="20" font-weight="400" fill="#8A8578">// AI Engineering</text>
  <text x="946" y="1244" font-family="'SF Mono', Menlo, 'DejaVu Sans Mono', monospace" font-size="30" font-weight="700" fill="#E14B16" text-anchor="end">@teachmebro</text>
  <text x="946" y="1278" font-family="'SF Mono', Menlo, 'DejaVu Sans Mono', monospace" font-size="18" font-weight="400" fill="#8A8578" text-anchor="end">Authorization is not</text>
  <text x="946" y="1302" font-family="'SF Mono', Menlo, 'DejaVu Sans Mono', monospace" font-size="18" font-weight="400" fill="#8A8578" text-anchor="end">transitive.</text>
  <circle cx="966" cy="1236" r="11" fill="#E14B16"/>
  <circle cx="990" cy="1236" r="11" fill="#1668D6"/>
</svg>
