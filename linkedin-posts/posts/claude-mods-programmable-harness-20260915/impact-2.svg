<svg width="1080" height="1080" viewBox="0 0 1080 1080" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="grid2" width="54" height="54" patternUnits="userSpaceOnUse">
      <path d="M 54 0 L 0 0 0 54" fill="none" stroke="#d8d2c6" stroke-width="1" stroke-opacity="0.45"/>
    </pattern>
  </defs>

  <rect width="1080" height="1080" fill="#f1ede5"/>
  <rect width="1080" height="1080" fill="url(#grid2)"/>

  <!-- Decorative node trail, top right -->
  <path d="M 790 148 L 872 96 L 946 176 L 1006 132" fill="none" stroke="#c9c2b4" stroke-width="1.6"/>
  <circle cx="790" cy="148" r="7" fill="#1668d4"/>
  <circle cx="872" cy="96" r="5" fill="#b8b1a3"/>
  <circle cx="946" cy="176" r="5" fill="#b8b1a3"/>
  <circle cx="1006" cy="132" r="7" fill="#e0531f"/>

  <!-- Eyebrow -->
  <rect x="80" y="112" width="26" height="3" fill="#6b6a63"/>
  <text x="122" y="123" font-family="'SF Mono','Menlo','Consolas',monospace"
        font-size="23" font-weight="700" letter-spacing="5" fill="#6b6a63">TWO POSTS, ONE TRENDING PAGE</text>

  <!-- Headline -->
  <text x="80" y="260" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="90" font-weight="900" fill="#16150f" letter-spacing="-2.5">The model is the</text>
  <text x="80" y="358" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="90" font-weight="900" fill="#e0531f" letter-spacing="-2.5">commodity.</text>
  <text x="80" y="470" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="90" font-weight="900" fill="#16150f" letter-spacing="-2.5">The harness</text>
  <text x="80" y="568" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="90" font-weight="900" fill="#1668d4" letter-spacing="-2.5">is the product.</text>

  <!-- Rule + sub-statement -->
  <rect x="80" y="636" width="7" height="118" fill="#e0531f"/>
  <text x="118" y="686" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="37" font-weight="700" fill="#16150f">One person left over the harness.</text>
  <text x="118" y="738" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="37" font-weight="700" fill="#16150f">One person made it run Tetris.</text>

  <!-- Stats -->
  <text x="80" y="874" font-family="'SF Mono','Menlo','Consolas',monospace"
        font-size="54" font-weight="700" fill="#e0531f">508K views</text>
  <text x="80" y="914" font-family="'SF Mono','Menlo','Consolas',monospace"
        font-size="22" font-weight="400" fill="#6b6a63">on the mod launch</text>

  <rect x="560" y="832" width="1" height="92" fill="#cfc8ba"/>

  <text x="612" y="874" font-family="'SF Mono','Menlo','Consolas',monospace"
        font-size="54" font-weight="700" fill="#1668d4">23 days</text>
  <text x="612" y="914" font-family="'SF Mono','Menlo','Consolas',monospace"
        font-size="22" font-weight="400" fill="#6b6a63">since he last opened it</text>

  <!-- Footer -->
  <rect x="80" y="960" width="920" height="1" fill="#cfc8ba"/>
  <text x="80" y="1012" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="29" font-weight="700" fill="#16150f">Altaf Shaikh</text>
  <text x="80" y="1046" font-family="'SF Mono','Menlo','Consolas',monospace"
        font-size="22" font-weight="400" fill="#6b6a63">// AI Engineering</text>

  <text x="1000" y="1010" font-family="'SF Mono','Menlo','Consolas',monospace"
        font-size="31" font-weight="700" text-anchor="end" fill="#e0531f">@teachmebro</text>
  <text x="1000" y="1046" font-family="'SF Mono','Menlo','Consolas',monospace"
        font-size="21" font-weight="400" text-anchor="end" fill="#6b6a63">zero tokens to play</text>
</svg>
