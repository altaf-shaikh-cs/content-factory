  <rect x="80" y="1075" width="920" height="1" fill="#ffffff" fill-opacity="0.1"/>

  <!-- Tagline -->
  <text x="540" y="1140"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="24" font-weight="300" text-anchor="middle" fill="#94a3b8" letter-spacing="1">Auto mode doesn&#8217;t skip the check. It upgrades who runs it.</text>

  <!-- Handle -->
  <text x="540" y="1205"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="32" font-weight="700" text-anchor="middle" fill="#22d3ee">@teachmebro</text>

  <!-- Byline -->
  <text x="540" y="1258"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
