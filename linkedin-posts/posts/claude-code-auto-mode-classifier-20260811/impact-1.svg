      <stop offset="0%" stop-color="#0a0e1a"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="acc1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="tile1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a2538"/>
      <stop offset="100%" stop-color="#141e2d"/>
    </linearGradient>
    <linearGradient id="humanTile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#200c0c"/>
      <stop offset="100%" stop-color="#141e2d"/>
    </linearGradient>
    <linearGradient id="classifierTile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#061a20"/>
      <stop offset="100%" stop-color="#141e2d"/>
