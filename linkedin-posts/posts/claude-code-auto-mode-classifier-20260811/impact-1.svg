  <text x="80" y="960"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="18" font-weight="700" letter-spacing="4" fill="#94a3b8">CLASSIFIER</text>
  <!-- Track -->
  <rect x="240" y="942" width="670" height="20" rx="10" fill="#1e2a3a"/>
  <!-- Fill: 89% of 670 = 596.3 px -->
  <rect x="240" y="942" width="596" height="20" rx="10" fill="url(#acc1)"/>
  <text x="920" y="958"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="18" font-weight="700" text-anchor="end" fill="#22d3ee">89%</text>

