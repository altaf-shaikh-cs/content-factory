  <text x="218" y="728"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="18" font-weight="700" letter-spacing="5" text-anchor="middle" fill="#64748b">TESTERS</text>
  <text x="218" y="760"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
