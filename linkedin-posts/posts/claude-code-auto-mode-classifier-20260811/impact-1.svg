        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="28" font-weight="700" letter-spacing="5" text-anchor="middle" fill="#475569">SAFETY CATCH RATE</text>

  <!-- Left hero tile: HUMAN REVIEWER -->
  <rect x="80" y="220" width="438" height="305" rx="16" fill="url(#humanTile)"/>
  <rect x="80" y="220" width="438" height="4" rx="2" fill="#ef4444"/>
  <text x="299" y="278"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="21" font-weight="700" letter-spacing="6" text-anchor="middle" fill="#ef4444">HUMAN</text>
  <text x="299" y="395"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="96" font-weight="900" text-anchor="middle" fill="#ef4444">13.6%</text>
  <text x="299" y="438"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
