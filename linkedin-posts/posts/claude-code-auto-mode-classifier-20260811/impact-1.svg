        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="18" font-weight="700" letter-spacing="4" fill="#94a3b8">HUMAN</text>
  <!-- Track -->
  <rect x="240" y="894" width="670" height="20" rx="10" fill="#1e2a3a"/>
  <!-- Fill: 13.6% of 670 = 91.1 px -->
  <rect x="240" y="894" width="91" height="20" rx="10" fill="#ef4444" fill-opacity="0.75"/>
  <text x="920" y="910"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="18" font-weight="700" text-anchor="end" fill="#ef4444">13.6%</text>

