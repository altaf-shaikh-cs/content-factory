        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="16" text-anchor="middle" fill="#64748b">declines to 5% by prompt 50</text>

  <!-- VS -->
  <text x="540" y="388"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="26" font-weight="700" text-anchor="middle" fill="#334155">vs</text>

