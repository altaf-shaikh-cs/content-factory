  <!-- Tile 3: rollout date -->
  <rect x="722" y="592" width="278" height="228" rx="16" fill="url(#tile1)"/>
  <rect x="722" y="592" width="278" height="4" rx="2" fill="url(#acc1)"/>
  <text x="861" y="680"
