<svg width="1080" height="1080" viewBox="0 0 1080 1080" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cream" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f4f1ea"/>
      <stop offset="100%" stop-color="#eeebe3"/>
    </linearGradient>
  </defs>

  <rect width="1080" height="1080" fill="url(#cream)"/>

  <!-- Sparse constellation, top right, kept above the headline cap height -->
  <g stroke="#c9c4b8" stroke-width="1.5" fill="none" opacity="0.85">
    <path d="M812 112 L884 164 L946 104 L992 144"/>
  </g>
  <g fill="#c9c4b8">
    <circle cx="812" cy="112" r="4"/>
    <circle cx="946" cy="104" r="4"/>
  </g>
  <circle cx="884" cy="164" r="7" fill="#d94f16"/>
  <circle cx="992" cy="144" r="7" fill="#1668d0"/>

  <!-- Eyebrow -->
  <rect x="80" y="106" width="34" height="3" fill="#8a857d"/>
  <text x="130" y="116"
        font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="23" font-weight="700" letter-spacing="6" fill="#8a857d">BEFORE YOU ADD AGENTS</text>

  <!-- Headline: the rule -->
  <text x="80" y="228"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="94" font-weight="900" fill="#1c1a17" letter-spacing="-2">Three Briefs.</text>
  <text x="80" y="330"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="94" font-weight="900" fill="#d94f16" letter-spacing="-2">No Overlap.</text>
  <text x="80" y="432"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="94" font-weight="900" fill="#1668d0" letter-spacing="-2">Then Split.</text>

  <!-- Subhead -->
  <rect x="80" y="472" width="7" height="96" fill="#d94f16"/>
  <text x="116" y="514"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="36" font-weight="700" fill="#1c1a17">Multi-agent buys <tspan fill="#d94f16">context</tspan>, not speed.</text>
  <text x="116" y="556"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="36" font-weight="700" fill="#1c1a17">You pay about <tspan fill="#1668d0">15&#215;</tspan> for it.</text>

  <!-- The three briefs -->
  <rect x="80" y="606" width="5" height="112" fill="#1c1a17"/>
  <text x="106" y="646"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="21" font-weight="700" letter-spacing="4" fill="#1c1a17">OBJECTIVE</text>
  <text x="106" y="690"
        font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="19" fill="#7d786f">what it is for</text>

  <rect x="393" y="606" width="5" height="112" fill="#d94f16"/>
  <text x="419" y="646"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="21" font-weight="700" letter-spacing="4" fill="#d94f16">OUTPUT FORMAT</text>
  <text x="419" y="690"
        font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="19" fill="#7d786f">what it returns</text>

  <rect x="706" y="606" width="5" height="112" fill="#1668d0"/>
  <text x="732" y="646"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="21" font-weight="700" letter-spacing="4" fill="#1668d0">MUST NOT TOUCH</text>
  <text x="732" y="690"
        font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="19" fill="#7d786f">where its edge sits</text>

  <text x="80" y="800"
        font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="20" fill="#7d786f">Cannot write them without overlap? The work is not independent.</text>

  <!-- Stats -->
  <text x="80" y="878"
        font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="50" font-weight="700" fill="#d94f16">+90.2%</text>
  <text x="80" y="910"
        font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="19" fill="#7d786f">vs a single agent</text>

  <rect x="440" y="838" width="1" height="82" fill="#d3cec2"/>

  <text x="480" y="878"
        font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="50" font-weight="700" fill="#1668d0">15&#215;</text>
  <text x="480" y="910"
        font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="19" fill="#7d786f">the tokens of a chat</text>

  <!-- Footer -->
  <rect x="80" y="950" width="920" height="1" fill="#d3cec2"/>

  <text x="80" y="996"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="27" font-weight="700" fill="#1c1a17">@teachmebro</text>
  <text x="80" y="1028"
        font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="19" fill="#7d786f">Altaf Shaikh  //  AI Engineering</text>

  <text x="936" y="996"
        font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="19" text-anchor="end" fill="#7d786f">more agents will not fix</text>
  <text x="936" y="1024"
        font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="19" text-anchor="end" fill="#7d786f">work that is not independent</text>
  <circle cx="966" cy="1010" r="9" fill="#d94f16"/>
  <circle cx="990" cy="1010" r="9" fill="#1668d0"/>
</svg>
