<svg width="1080" height="1350" viewBox="0 0 1080 1350" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0e1a"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a2538"/>
      <stop offset="100%" stop-color="#141e2d"/>
    </linearGradient>
    <radialGradient id="heroGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1080" height="1350" fill="url(#bg)"/>
  <ellipse cx="540" cy="380" rx="440" ry="220" fill="url(#heroGlow)"/>

  <rect x="80" y="80" width="920" height="4" rx="2" fill="url(#accent)"/>

  <text x="80" y="154"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="26" font-weight="700" letter-spacing="8" fill="#22d3ee">AI ENGINEERING</text>

  <text x="80" y="232"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="44" font-weight="700" fill="#e2e8f0">The number nobody quotes</text>

  <!-- Hero number -->
  <text x="540" y="470"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="260" font-weight="900" text-anchor="middle" fill="url(#accent)">15&#215;</text>

  <text x="540" y="542"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="38" font-weight="300" text-anchor="middle" fill="#cbd5e1" letter-spacing="1">
    the tokens of a chat interaction
  </text>

  <rect x="80" y="600" width="920" height="1" fill="#ffffff" fill-opacity="0.1"/>

  <!-- Stat tiles -->
  <rect x="80" y="630" width="293" height="270" rx="16" fill="url(#tile)"/>
  <rect x="80" y="630" width="293" height="4" rx="2" fill="url(#accent)"/>
  <text x="226" y="746"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="66" font-weight="900" text-anchor="middle" fill="url(#accent)">90.2%</text>
  <text x="226" y="800"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="20" font-weight="700" letter-spacing="5" text-anchor="middle" fill="#64748b">BETTER</text>
  <text x="226" y="838"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="18" text-anchor="middle" fill="#475569">vs a single agent</text>
  <text x="226" y="866"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="18" text-anchor="middle" fill="#475569">on the research eval</text>

  <rect x="393" y="630" width="293" height="270" rx="16" fill="url(#tile)"/>
  <rect x="393" y="630" width="293" height="4" rx="2" fill="url(#accent)"/>
  <text x="539" y="746"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="66" font-weight="900" text-anchor="middle" fill="url(#accent)">80%</text>
  <text x="539" y="800"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="20" font-weight="700" letter-spacing="5" text-anchor="middle" fill="#64748b">OF VARIANCE</text>
  <text x="539" y="838"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="18" text-anchor="middle" fill="#475569">explained by token</text>
  <text x="539" y="866"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="18" text-anchor="middle" fill="#475569">usage alone</text>

  <rect x="706" y="630" width="294" height="270" rx="16" fill="url(#tile)"/>
  <rect x="706" y="630" width="294" height="4" rx="2" fill="url(#accent)"/>
  <text x="853" y="746"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="66" font-weight="900" text-anchor="middle" fill="url(#accent)">90%</text>
  <text x="853" y="800"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="20" font-weight="700" letter-spacing="5" text-anchor="middle" fill="#64748b">LESS TIME</text>
  <text x="853" y="838"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="18" text-anchor="middle" fill="#475569">from parallel</text>
  <text x="853" y="866"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="18" text-anchor="middle" fill="#475569">tool calling</text>

  <rect x="80" y="946" width="920" height="1" fill="#ffffff" fill-opacity="0.06"/>

  <text x="80" y="994"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="20" font-weight="700" letter-spacing="5" fill="#475569">TOKENS VS A CHAT</text>

  <!-- Single agent bar: 4x of 15x = 197 of 740 -->
  <text x="80" y="1062"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="20" font-weight="600" fill="#94a3b8">1 agent</text>
  <rect x="250" y="1042" width="650" height="22" rx="11" fill="#1e2a3a"/>
  <rect x="250" y="1042" width="173" height="22" rx="11" fill="#22d3ee" fill-opacity="0.55"/>
  <text x="1000" y="1060"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="20" font-weight="700" text-anchor="end" fill="#22d3ee">4&#215;</text>

  <text x="80" y="1116"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="20" font-weight="600" fill="#94a3b8">many agents</text>
  <rect x="250" y="1096" width="650" height="22" rx="11" fill="#1e2a3a"/>
  <rect x="250" y="1096" width="650" height="22" rx="11" fill="url(#accent)"/>
  <text x="1000" y="1114"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="20" font-weight="700" text-anchor="end" fill="#a78bfa">15&#215;</text>

  <text x="80" y="1176"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="21" font-weight="400" fill="#64748b">
    Cheapest fix on the list: rewriting the tool descriptions. 40% less time to finish a task.
  </text>

  <rect x="80" y="1216" width="920" height="1" fill="#ffffff" fill-opacity="0.1"/>

  <text x="540" y="1252"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="30" font-weight="300" text-anchor="middle" fill="#94a3b8" letter-spacing="2">
    Multi-agent buys context, not speed.
  </text>

  <text x="540" y="1296"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="27" font-weight="700" text-anchor="middle" fill="url(#accent)">@teachmebro</text>

  <text x="540" y="1330"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="20" font-weight="600" text-anchor="middle" fill="#475569">
    Altaf Shaikh  &#183;  AI Engineering
  </text>
</svg>
