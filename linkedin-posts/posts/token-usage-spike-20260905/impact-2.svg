  <rect x="80" y="460" width="920" height="400" rx="20" fill="#1c1a17"/>
  <circle cx="122" cy="502" r="9" fill="#ff5f57"/>
  <circle cx="154" cy="502" r="9" fill="#febc2e"/>
  <circle cx="186" cy="502" r="9" fill="#28c840"/>
  <rect x="80" y="532" width="920" height="1" fill="#ffffff" fill-opacity="0.08"/>

  <text x="122" y="586"
        font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
        font-size="24" fill="#8a8378">~/.claude/settings.json</text>

  <text x="122" y="654"
        font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
        font-size="30" font-weight="700" fill="#ff6b5b">- "model": "opus[1m]"</text>
  <text x="600" y="654"
        font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
        font-size="21" fill="#7a736a">no compact ceiling</text>

  <text x="122" y="712"
        font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
