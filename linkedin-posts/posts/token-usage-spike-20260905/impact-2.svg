  <rect x="80" y="918" width="920" height="1" fill="#000000" fill-opacity="0.1"/>

  <text x="540" y="966"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="26" font-weight="400" text-anchor="middle" fill="#6b6459">
    You do not pay for context once. You pay for it every turn.
