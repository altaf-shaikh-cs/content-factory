  <!-- Headline -->
  <text x="80" y="252"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="94" font-weight="900" fill="#16130f" letter-spacing="-2">213 tokens read</text>
  <text x="80" y="352"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="94" font-weight="900" fill="#16130f" letter-spacing="-2">per 1 written.</text>

  <text x="80" y="412"
