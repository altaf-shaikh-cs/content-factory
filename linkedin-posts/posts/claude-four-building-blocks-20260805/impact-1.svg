<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1350" width="1080" height="1350">
  <defs>
    <linearGradient id="bgWash" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fdfcf9"/>
      <stop offset="100%" stop-color="#f7f6f1"/>
    </linearGradient>
    <linearGradient id="accentRule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#d9534f"/>
      <stop offset="100%" stop-color="#3f9e5a"/>
    </linearGradient>
  </defs>

  <rect width="1080" height="1350" fill="url(#bgWash)"/>

  <!-- header -->
  <text x="80" y="118" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="24" font-weight="600" fill="#9a958a" letter-spacing="6">SAME MODEL &#183; DIFFERENT SETUP</text>
  <text x="80" y="192" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="60" font-weight="800" fill="#1b1b1b">Two engineers.</text>
  <text x="80" y="258" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="60" font-weight="800" fill="#1b1b1b">One onboarded the AI.</text>
  <text x="80" y="312" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="30" font-weight="400" fill="#6b675e">The only difference is configuration.</text>

  <!-- LEFT CARD: default -->
  <rect x="80" y="366" width="440" height="404" rx="22" fill="#fdf1f0" stroke="#f0c9c6" stroke-width="2"/>
  <text x="112" y="414" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="26" font-weight="800" fill="#d9534f">&#10007;  DEFAULT</text>
  <text x="112" y="446" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="19" fill="#b4726f">day one, every day</text>
  <rect x="112" y="470" width="376" height="212" rx="12" fill="#2b2b2b"/>
  <text x="136" y="508" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="19" fill="#e8e8e8">&gt; explain the project</text>
  <text x="136" y="546" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="19" fill="#e8e8e8">&gt; paste the conventions</text>
  <text x="136" y="584" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="19" fill="#e8e8e8">&gt; list what not to touch</text>
  <text x="136" y="622" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="19" fill="#8b8b8b">&gt; tomorrow: repeat</text>
  <text x="136" y="660" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="19" fill="#8b8b8b">&gt; tomorrow: repeat</text>
  <text x="112" y="722" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="27" font-weight="700" fill="#1b1b1b">Capable and useless.</text>
  <text x="112" y="752" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="21" fill="#8a857b">Nothing persists.</text>

  <!-- RIGHT CARD: configured -->
  <rect x="560" y="366" width="440" height="404" rx="22" fill="#eff8f2" stroke="#c8e6d3" stroke-width="2"/>
  <text x="592" y="414" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="26" font-weight="800" fill="#3f9e5a">&#10003;  CONFIGURED</text>
  <text x="592" y="446" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="19" fill="#6f9e80">set up once</text>
  <rect x="592" y="470" width="376" height="212" rx="12" fill="#2b2b2b"/>
  <text x="616" y="508" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="19" fill="#e8e8e8">&gt; skills loaded</text>
  <text x="616" y="546" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="19" fill="#e8e8e8">&gt; plugins installed</text>
  <text x="616" y="584" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="19" fill="#e8e8e8">&gt; projects isolated</text>
  <text x="616" y="622" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="19" fill="#e8e8e8">&gt; artifacts shipping</text>
  <text x="616" y="660" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="19" fill="#7fbf95">&gt; tomorrow: nothing to redo</text>
  <text x="592" y="722" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="27" font-weight="700" fill="#1b1b1b">Knows how you work.</text>
  <text x="592" y="752" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="21" fill="#8a857b">Every conversation.</text>

  <!-- hero number -->
  <text x="540" y="884" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="124" font-weight="900" fill="#3f9e5a">4</text>
  <text x="540" y="926" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="28" font-weight="400" fill="#6b675e">features close the gap</text>

  <!-- 2x2 feature grid -->
  <rect x="80" y="962" width="440" height="112" rx="16" fill="#ffffff" stroke="#e5e2d9" stroke-width="2"/>
  <text x="112" y="1010" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="32" font-weight="800" fill="#1b1b1b">Skills</text>
  <text x="112" y="1046" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="21" fill="#6d5bd0">consistency</text>

  <rect x="560" y="962" width="440" height="112" rx="16" fill="#ffffff" stroke="#e5e2d9" stroke-width="2"/>
  <text x="592" y="1010" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="32" font-weight="800" fill="#1b1b1b">Plugins</text>
  <text x="592" y="1046" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="21" fill="#6d5bd0">capability</text>

  <rect x="80" y="1094" width="440" height="112" rx="16" fill="#ffffff" stroke="#e5e2d9" stroke-width="2"/>
  <text x="112" y="1142" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="32" font-weight="800" fill="#1b1b1b">Projects</text>
  <text x="112" y="1178" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="21" fill="#6d5bd0">separation</text>

  <rect x="560" y="1094" width="440" height="112" rx="16" fill="#ffffff" stroke="#e5e2d9" stroke-width="2"/>
  <text x="592" y="1142" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="32" font-weight="800" fill="#1b1b1b">Artifacts</text>
  <text x="592" y="1178" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="21" fill="#6d5bd0">output</text>

  <!-- footer -->
  <rect x="80" y="1240" width="920" height="4" rx="2" fill="url(#accentRule)"/>
  <text x="80" y="1288" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="26" font-weight="600" fill="#3f3c36">You didn&#8217;t hire a bad assistant. You skipped onboarding.</text>
  <text x="80" y="1326" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="30" font-weight="800" fill="#6d5bd0">@teachmebro</text>
  <text x="1000" y="1326" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="21" fill="#8a857b">Altaf Shaikh &#183; AI Engineering</text>
</svg>
