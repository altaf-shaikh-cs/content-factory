<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <defs>
    <radialGradient id="glow1" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#c4b5fd" stop-opacity="0.45"/>
      <stop offset="55%" stop-color="#fbbf24" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accentLine1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="handleGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>

  <!-- White background -->
  <rect width="1080" height="1080" fill="#ffffff"/>

  <!-- Decorative glow smear between hero and subtitle -->
  <ellipse cx="540" cy="448" rx="420" ry="100" fill="url(#glow1)"/>

  <!-- Hero number "25" — giant, charcoal -->
  <text x="540" y="320"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
    font-size="280" font-weight="900" letter-spacing="-14"
    fill="#1a1a1a" text-anchor="middle">25</text>

  <!-- "TIPS." — violet accent, supporting the number -->
  <text x="540" y="460"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
    font-size="118" font-weight="900" letter-spacing="10"
    fill="#7c3aed" text-anchor="middle">TIPS.</text>

  <!-- Secondary claim line 1 -->
  <text x="540" y="565"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
    font-size="66" font-weight="700"
    fill="#1a1a1a" text-anchor="middle">Won&#8217;t make you better</text>

  <!-- Secondary claim line 2 -->
  <text x="540" y="643"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
    font-size="66" font-weight="700"
    fill="#1a1a1a" text-anchor="middle">at Claude Code.</text>

  <!-- Accent separator -->
  <rect x="390" y="690" width="300" height="4" rx="2" fill="url(#accentLine1)"/>

  <!-- Billion-token rule label -->
  <text x="540" y="737"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
    font-size="25" font-weight="700" letter-spacing="5"
    fill="#7c3aed" text-anchor="middle">THE BILLION-TOKEN RULE</text>

  <!-- Tagline -->
  <text x="540" y="814"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
    font-size="50" font-weight="700"
    fill="#1a1a1a" text-anchor="middle">Volume beats tips lists.</text>

  <!-- Stats row — muted -->
  <text x="540" y="878"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
    font-size="26" font-weight="400"
    fill="#9ca3af" text-anchor="middle">25 tips &#183; 11 months &#183; 569 upvotes</text>

  <!-- Handle @teachmebro -->
  <text x="540" y="968"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
    font-size="40" font-weight="700"
    fill="#7c3aed" text-anchor="middle">@teachmebro</text>

  <!-- Author byline -->
  <text x="540" y="1014"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
    font-size="23" font-weight="400"
    fill="#9ca3af" text-anchor="middle">Altaf Shaikh &#183; AI Engineering</text>
</svg>
