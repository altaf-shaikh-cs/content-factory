<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1350" width="1080" height="1350">
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#EDEAE3"/>
      <stop offset="100%" stop-color="#E4E0D6"/>
    </linearGradient>
  </defs>
  <rect width="1080" height="1350" fill="url(#ground)"/>
  <text x="992" y="148" font-family="'SF Mono', Menlo, 'DejaVu Sans Mono', monospace" font-size="22" font-weight="400" fill="#8A8578" text-anchor="end">7 / 8</text>
  <line x1="88" y1="138" x2="134" y2="138" stroke="#8A8578" stroke-width="3"/>
  <text x="154" y="148" font-family="'SF Mono', Menlo, 'DejaVu Sans Mono', monospace" font-size="23" font-weight="700" fill="#8A8578" letter-spacing="6">FIND YOURSELF IN THE FOUR</text>
  <text x="88" y="262" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="58" font-weight="900" fill="#1A1A18">One habit.</text>
  <text x="88" y="326" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="58" font-weight="900" fill="#1A1A18">One architect move.</text>
  <rect x="88" y="414" width="152" height="58" fill="#DDD9CF" rx="10"/>
  <text x="164" y="452" font-family="'SF Mono', Menlo, 'DejaVu Sans Mono', monospace" font-size="20" font-weight="900" fill="#1A1A18" text-anchor="middle" letter-spacing="1">SKILL 1</text>
  <text x="270" y="442" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="27" font-weight="700" fill="#1A1A18">You ship the AI feature and hope it works</text>
  <text x="270" y="484" font-family="'SF Mono', Menlo, 'DejaVu Sans Mono', monospace" font-size="24" font-weight="400" fill="#E14B16">&#8594;  run evals, do error analysis</text>
  <line x1="88" y1="528" x2="992" y2="528" stroke="#D2CEC4" stroke-width="2"/>
  <rect x="88" y="566" width="152" height="58" fill="#C3D8EF" rx="10"/>
  <text x="164" y="604" font-family="'SF Mono', Menlo, 'DejaVu Sans Mono', monospace" font-size="20" font-weight="900" fill="#1A1A18" text-anchor="middle" letter-spacing="1">SKILL 2</text>
  <text x="270" y="594" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="27" font-weight="700" fill="#1A1A18">You accept whatever tradeoff the AI made</text>
  <text x="270" y="636" font-family="'SF Mono', Menlo, 'DejaVu Sans Mono', monospace" font-size="24" font-weight="400" fill="#E14B16">&#8594;  name the tradeoff yourself, first</text>
  <line x1="88" y1="680" x2="992" y2="680" stroke="#D2CEC4" stroke-width="2"/>
  <rect x="88" y="718" width="152" height="58" fill="#C9DCC2" rx="10"/>
  <text x="164" y="756" font-family="'SF Mono', Menlo, 'DejaVu Sans Mono', monospace" font-size="20" font-weight="900" fill="#1A1A18" text-anchor="middle" letter-spacing="1">SKILL 3</text>
  <text x="270" y="746" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="27" font-weight="700" fill="#1A1A18">You approve every agent suggestion by default</text>
  <text x="270" y="788" font-family="'SF Mono', Menlo, 'DejaVu Sans Mono', monospace" font-size="24" font-weight="400" fill="#E14B16">&#8594;  calibrate trust, verify the risky ones</text>
  <line x1="88" y1="832" x2="992" y2="832" stroke="#D2CEC4" stroke-width="2"/>
  <rect x="88" y="870" width="152" height="58" fill="#F6D6B8" rx="10"/>
  <text x="164" y="908" font-family="'SF Mono', Menlo, 'DejaVu Sans Mono', monospace" font-size="20" font-weight="900" fill="#1A1A18" text-anchor="middle" letter-spacing="1">SKILL 4</text>
  <text x="270" y="898" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="27" font-weight="700" fill="#1A1A18">You wait for the ticket to tell you what to build</text>
  <text x="270" y="940" font-family="'SF Mono', Menlo, 'DejaVu Sans Mono', monospace" font-size="24" font-weight="400" fill="#E14B16">&#8594;  pick the problem before it&#8217;s assigned</text>
  <text x="88" y="1038" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="24" font-weight="400" fill="#8A8578">Still a bricklayer on the left.</text>
  <text x="88" y="1074" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#1A1A18">Already the architect on the right.</text>
  <line x1="88" y1="1196" x2="992" y2="1196" stroke="#D2CEC4" stroke-width="2"/>
  <text x="88" y="1248" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="27" font-weight="700" fill="#1A1A18">Altaf Shaikh</text>
  <text x="88" y="1282" font-family="'SF Mono', Menlo, 'DejaVu Sans Mono', monospace" font-size="20" font-weight="400" fill="#8A8578">// AI Engineering</text>
  <text x="946" y="1244" font-family="'SF Mono', Menlo, 'DejaVu Sans Mono', monospace" font-size="30" font-weight="700" fill="#E14B16" text-anchor="end">@teachmebro</text>
  <text x="946" y="1278" font-family="'SF Mono', Menlo, 'DejaVu Sans Mono', monospace" font-size="18" font-weight="400" fill="#8A8578" text-anchor="end">Coding is the floor now,</text>
  <text x="946" y="1302" font-family="'SF Mono', Menlo, 'DejaVu Sans Mono', monospace" font-size="18" font-weight="400" fill="#8A8578" text-anchor="end">not the ceiling.</text>
  <circle cx="966" cy="1236" r="11" fill="#E14B16"/>
  <circle cx="990" cy="1236" r="11" fill="#1668D6"/>
</svg>
