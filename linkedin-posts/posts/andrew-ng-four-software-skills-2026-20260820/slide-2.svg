  <text x="88" y="262" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="54" font-weight="900" fill="#1A1A18">Coding isn&#8217;t one of them.</text>
