<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1350" width="1080" height="1350">
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#EDEAE3"/>
      <stop offset="100%" stop-color="#E4E0D6"/>
    </linearGradient>
  </defs>
  <rect width="1080" height="1350" fill="url(#ground)"/>
  <text x="992" y="148" font-family="'SF Mono', Menlo, 'DejaVu Sans Mono', monospace" font-size="22" font-weight="400" fill="#8A8578" text-anchor="end">3 / 8</text>
  <line x1="88" y1="138" x2="134" y2="138" stroke="#8A8578" stroke-width="3"/>
  <text x="154" y="148" font-family="'SF Mono', Menlo, 'DejaVu Sans Mono', monospace" font-size="23" font-weight="700" fill="#8A8578" letter-spacing="6">SKILL 1 OF 4</text>
  <text x="88" y="268" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="58" font-weight="900" fill="#1A1A18">Normal software is</text>
  <text x="88" y="334" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="58" font-weight="900" fill="#1A1A18">predictable. AI is not.</text>
  <rect x="88" y="452" width="904" height="366" fill="#DDD9CF" rx="18"/>
  <text x="132" y="534" font-family="'SF Mono', Menlo, 'DejaVu Sans Mono', monospace" font-size="46" font-weight="900" fill="#8A8578">01</text>
  <text x="220" y="536" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="42" font-weight="900" fill="#1A1A18">BUILD &amp; DEPLOY AI</text>
  <text x="132" y="610" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="32" font-weight="400" fill="#1A1A18">Ask it the same question twice,</text>
  <text x="132" y="654" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="32" font-weight="400" fill="#1A1A18">get two different answers back.</text>
  <text x="132" y="698" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="32" font-weight="400" fill="#1A1A18">Building the thing is not the skill.</text>
  <text x="132" y="742" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="32" font-weight="400" fill="#1A1A18">Controlling it is.</text>
  <rect x="88" y="858" width="904" height="158" fill="#FFFFFF" rx="16" opacity="0.55"/>
  <rect x="88" y="858" width="6" height="158" fill="#E14B16" rx="3"/>
  <text x="128" y="912" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="32" font-weight="700" fill="#1A1A18">The real work is disciplined evals</text>
  <text x="128" y="958" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="32" font-weight="700" fill="#1A1A18">and error analysis, measuring and</text>
  <text x="128" y="1004" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="32" font-weight="700" fill="#E14B16">improving the system on purpose.</text>
  <line x1="88" y1="1196" x2="992" y2="1196" stroke="#D2CEC4" stroke-width="2"/>
  <text x="88" y="1248" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="27" font-weight="700" fill="#1A1A18">Altaf Shaikh</text>
  <text x="88" y="1282" font-family="'SF Mono', Menlo, 'DejaVu Sans Mono', monospace" font-size="20" font-weight="400" fill="#8A8578">// AI Engineering</text>
  <text x="946" y="1244" font-family="'SF Mono', Menlo, 'DejaVu Sans Mono', monospace" font-size="30" font-weight="700" fill="#E14B16" text-anchor="end">@teachmebro</text>
  <text x="946" y="1278" font-family="'SF Mono', Menlo, 'DejaVu Sans Mono', monospace" font-size="18" font-weight="400" fill="#8A8578" text-anchor="end">Coding is the floor now,</text>
  <text x="946" y="1302" font-family="'SF Mono', Menlo, 'DejaVu Sans Mono', monospace" font-size="18" font-weight="400" fill="#8A8578" text-anchor="end">not the ceiling.</text>
  <circle cx="966" cy="1236" r="11" fill="#E14B16"/>
  <circle cx="990" cy="1236" r="11" fill="#1668D6"/>
</svg>
