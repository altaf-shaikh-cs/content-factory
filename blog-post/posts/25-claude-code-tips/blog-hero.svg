<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <linearGradient id="accentLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <pattern id="dotGrid" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.5" fill="#e4ddcc"/>
    </pattern>
  </defs>

  <rect x="0" y="0" width="1600" height="900" fill="#f5f1e7"/>
  <rect x="0" y="0" width="1600" height="900" fill="url(#dotGrid)"/>

  <!-- top label -->
  <g transform="translate(80,72)">
    <path d="M8 0 L11 5 L16 8 L11 11 L8 16 L5 11 L0 8 L5 5 Z" fill="#c2410c"/>
    <text x="26" y="12" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20" font-weight="700" letter-spacing="4" fill="#c2410c">CLAUDE CODE &#183; 25 TIPS &#183; 11 MONTHS</text>
  </g>

  <!-- headline -->
  <text x="80" y="212" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="68" font-weight="900" fill="#14181f">Claude Code Isn&#8217;t</text>
  <text x="80" y="290" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="68" font-weight="900" fill="#14181f">a Chat.</text>
  <text x="80" y="354" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="54" font-weight="900" fill="#7c3aed">It&#8217;s Infrastructure.</text>

  <text x="80" y="410" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="26" font-weight="400" fill="#475569">25 practitioner tips on context, testing,</text>
  <text x="80" y="444" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="26" font-weight="400" fill="#475569">and daily workflow &#8212; not another beginner list.</text>

  <!-- pill badges -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22" font-weight="600">
    <rect x="80" y="486" width="320" height="54" rx="27" fill="#f5f1e7" stroke="#0d9488" stroke-width="2"/>
    <text x="240" y="521" text-anchor="middle" fill="#0d9488">context management</text>

    <rect x="416" y="486" width="200" height="54" rx="27" fill="#f5f1e7" stroke="#7c3aed" stroke-width="2"/>
    <text x="516" y="521" text-anchor="middle" fill="#7c3aed">HANDOFF.md</text>

    <rect x="80" y="558" width="290" height="54" rx="27" fill="#f5f1e7" stroke="#c2410c" stroke-width="2"/>
    <text x="225" y="593" text-anchor="middle" fill="#c2410c">git bisect + tmux</text>

    <rect x="386" y="558" width="266" height="54" rx="27" fill="#f5f1e7" stroke="#1d4ed8" stroke-width="2"/>
    <text x="519" y="593" text-anchor="middle" fill="#1d4ed8">terminal aliases</text>
  </g>

  <!-- terminal window -->
  <g>
    <rect x="880" y="200" width="640" height="440" rx="16" fill="#14181f"/>
    <rect x="880" y="200" width="640" height="46" rx="16" fill="#1e2430"/>
    <rect x="880" y="228" width="640" height="18" fill="#1e2430"/>
    <circle cx="912" cy="223" r="8" fill="#ef4444"/>
    <circle cx="938" cy="223" r="8" fill="#f59e0b"/>
    <circle cx="964" cy="223" r="8" fill="#22c55e"/>
    <text x="1200" y="229" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" fill="#64748b">~/project &#183; session</text>

    <text x="912" y="300" font-family="Menlo, Consolas, monospace" font-size="22" fill="#22d3ee">$ context-budget</text>

    <text x="912" y="350" font-family="Menlo, Consolas, monospace" font-size="20" fill="#94a3b8">before</text>
    <rect x="1010" y="332" width="430" height="22" rx="4" fill="#3f2d1a"/>
    <rect x="1010" y="332" width="430" height="22" rx="4" fill="#f59e0b" opacity="0.85"/>
    <text x="1450" y="350" font-family="Menlo, Consolas, monospace" font-size="20" fill="#e2e8f0">19.0k</text>

    <text x="912" y="392" font-family="Menlo, Consolas, monospace" font-size="20" fill="#94a3b8">after</text>
    <rect x="1010" y="374" width="204" height="22" rx="4" fill="#0f3d38"/>
    <rect x="1010" y="374" width="204" height="22" rx="4" fill="#22d3ee" opacity="0.85"/>
    <text x="1450" y="392" font-family="Menlo, Consolas, monospace" font-size="20" fill="#e2e8f0">9.0k</text>

    <text x="912" y="440" font-family="Menlo, Consolas, monospace" font-size="20" fill="#64748b">&#8594; ~50% less fixed overhead, every session</text>

    <line x1="912" y1="472" x2="1488" y2="472" stroke="#2a3242" stroke-width="1"/>

    <text x="912" y="516" font-family="Menlo, Consolas, monospace" font-size="22" fill="#a78bfa">$ /handoff</text>
    <text x="912" y="552" font-family="Menlo, Consolas, monospace" font-size="20" fill="#64748b">writing HANDOFF.md ...</text>
    <text x="912" y="584" font-family="Menlo, Consolas, monospace" font-size="20" fill="#22c55e">done &#8212; fresh session ready</text>
    <text x="912" y="614" font-family="Menlo, Consolas, monospace" font-size="22" fill="#e2e8f0">$ <tspan fill="#e2e8f0" opacity="0.5">&#9608;</tspan></text>
  </g>

  <rect x="80" y="800" width="1440" height="4" rx="2" fill="url(#accentLine)"/>
  <text x="80" y="846" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="23" font-weight="600" fill="#14181f">Claude Code Isn&#8217;t a Chat. It&#8217;s Infrastructure You Configure.</text>

  <text x="1520" y="840" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="30" font-weight="800" fill="#0d9488">@teachmebro</text>
  <text x="1520" y="870" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20" fill="#475569">Altaf Shaikh &#183; AI Engineering</text>
</svg>
