<svg width="1600" height="900" viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="numGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0891b2"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="#faf6ee"/>

  <!-- Headline -->
  <text x="90" y="120" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="58" font-weight="900" fill="#161616">The Dashboard Chart</text>
  <rect x="86" y="150" width="430" height="46" fill="#f6a89a" opacity="0.55"/>
  <text x="90" y="188" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="58" font-weight="900" fill="#161616">Isn't the Real Bill.</text>

  <!-- Left card: Dashboard says -->
  <rect x="90" y="250" width="670" height="320" rx="20" fill="#fff5f3" stroke="#e0776a" stroke-width="3"/>
  <circle cx="140" cy="300" r="18" fill="none" stroke="#c0392b" stroke-width="4"/>
  <line x1="132" y1="292" x2="148" y2="308" stroke="#c0392b" stroke-width="4" stroke-linecap="round"/>
  <line x1="148" y1="292" x2="132" y2="308" stroke="#c0392b" stroke-width="4" stroke-linecap="round"/>
  <text x="175" y="308" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="30" font-weight="700" fill="#c0392b">Dashboard says</text>

  <text x="140" y="400" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="52" font-weight="800" fill="#161616">52.3k in</text>
  <text x="140" y="450" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="52" font-weight="800" fill="#161616">19.4M out</text>
  <text x="140" y="530" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="24" font-weight="400" fill="#8a5a52">The chart's only slice: uncached tokens</text>

  <!-- Right card: Transcripts say -->
  <rect x="840" y="250" width="670" height="320" rx="20" fill="#f2fbf6" stroke="#1c9c6e" stroke-width="3"/>
  <circle cx="890" cy="300" r="18" fill="none" stroke="#1c9c6e" stroke-width="4"/>
  <path d="M 881 300 L 888 308 L 900 291" fill="none" stroke="#1c9c6e" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="925" y="308" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="30" font-weight="700" fill="#1c9c6e">Transcripts say</text>

  <text x="890" y="390" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="40" font-weight="800" fill="#161616">11k in &#183; 5.6M out</text>
  <text x="890" y="440" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="40" font-weight="800" fill="#161616">31.5M cache writes</text>
  <text x="890" y="490" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="40" font-weight="800" fill="url(#numGradient)">1,196M cache reads</text>

  <!-- Divider arrow -->
  <line x1="760" y1="410" x2="840" y2="410" stroke="#161616" stroke-width="3"/>
  <path d="M 828 398 L 840 410 L 828 422" fill="none" stroke="#161616" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Big stat -->
  <text x="800" y="720" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="140" font-weight="900" fill="url(#numGradient)" text-anchor="middle">213&#215;</text>
  <text x="800" y="765" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="28" font-weight="400" fill="#4a4a4a" text-anchor="middle">tokens re-read for every 1 token produced</text>

  <!-- Footer -->
  <line x1="90" y1="815" x2="1510" y2="815" stroke="#d8cfc0" stroke-width="2"/>
  <text x="90" y="855" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="26" font-weight="500" fill="#161616">Your Usage Dashboard Is Lying to You</text>
  <text x="1510" y="850" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="32" font-weight="800" fill="#7c3aed" text-anchor="end">@teachmebro</text>
  <text x="1510" y="878" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20" font-weight="400" fill="#6b6b6b" text-anchor="end">Altaf Shaikh &#183; AI Engineering</text>
</svg>
