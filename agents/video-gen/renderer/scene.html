<!doctype html>
<meta charset="utf-8">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:#000;overflow:hidden}
#stage{position:relative;overflow:hidden;background:#0a0e1a;color:#e2e8f0;
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;-webkit-font-smoothing:antialiased}
#grain{position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(120% 80% at 50% 0%,rgba(37,58,86,.55) 0%,rgba(10,14,26,0) 60%)}
#backdrop{position:absolute;inset:0;background-size:cover;background-position:center;z-index:0}
.scene{z-index:1}
.scene .bg{position:absolute;inset:0;background-size:cover;background-position:center;z-index:-2}
.scene .scrim{position:absolute;inset:0;z-index:-1;
  background:linear-gradient(180deg,rgba(10,14,26,.62) 0%,rgba(10,14,26,.80) 55%,rgba(10,14,26,.94) 100%)}
.scene{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;
  padding:120px 88px 170px;will-change:opacity,transform}
.eyebrow{font-size:25px;letter-spacing:.2em;text-transform:uppercase;color:#f59e0b;font-weight:700;margin-bottom:40px}
.title{font-size:78px;line-height:1.1;font-weight:800;letter-spacing:-.025em;color:#fff}
.title.sm{font-size:60px}
.title .dim{color:#64748b}
.title .amber{color:#f59e0b}
.title .cyan{color:#22d3ee}
.sub{margin-top:40px;font-size:34px;line-height:1.45;color:#94a3b8;max-width:840px}
.rule{height:4px;background:#f59e0b;width:120px;margin:44px 0 0;border-radius:2px}
/* stat pair */
.pair{display:flex;gap:28px;margin-top:56px}
.card{flex:1 1 0;min-width:0;background:#111827;border:1px solid #243b54;border-radius:22px;padding:40px 34px}
.card .v{font-size:96px;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1}
.card .l{margin-top:16px;font-size:25px;letter-spacing:.13em;text-transform:uppercase;color:#94a3b8;font-weight:600}
.card.a .v{color:#22d3ee}.card.b .v{color:#f59e0b}
/* bars */
.bars{display:flex;align-items:flex-end;gap:12px;height:520px;margin-top:56px}
.bar{flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:100%}
.bseg{width:100%;border-radius:5px 5px 0 0;transform-origin:bottom;will-change:transform}
.bseg.base{background:linear-gradient(180deg,#22d3ee 0%,#0e7490 100%)}
.bseg.slab{background:#f59e0b;border-radius:5px 5px 0 0}
.bseg.base.under{border-radius:0}
.axis{display:flex;justify-content:space-between;margin-top:22px;font-size:22px;letter-spacing:.14em;
  color:#64748b;font-weight:600;font-family:ui-monospace,'SF Mono',monospace}
.punch{margin-top:44px;font-size:44px;font-weight:700;color:#fff;line-height:1.25}
.punch em{font-style:normal;color:#f59e0b}
/* formula */
.formula{display:flex;flex-wrap:wrap;align-items:baseline;gap:20px;margin-top:20px}
.tok{font-size:60px;font-weight:800;letter-spacing:-.02em;color:#fff}
.tok.op{color:#64748b;font-weight:600}
.tok.hl{color:#f59e0b}
.tok.hl2{color:#22d3ee}
/* list */
.item{display:flex;gap:26px;align-items:flex-start;margin-top:38px}
.num{flex:none;width:56px;height:56px;border-radius:14px;background:#f59e0b;color:#0a0e1a;
  font-weight:800;font-size:30px;display:flex;align-items:center;justify-content:center}
.itext{font-size:40px;line-height:1.35;color:#e2e8f0;font-weight:600;padding-top:4px}
.itext span{color:#94a3b8;font-weight:400;display:block;font-size:32px;margin-top:8px}
/* footer + progress */
#footer{position:absolute;left:88px;right:88px;bottom:76px;display:flex;justify-content:space-between;
  align-items:center;font-size:25px;color:#64748b;font-weight:600;letter-spacing:.06em}
#footer .h{color:#a78bfa}
#track{position:absolute;left:0;right:0;bottom:0;height:8px;background:#182a3d}
#fill{height:100%;width:0;background:#f59e0b}
</style>
<div id="stage"><div id="grain"></div></div>
<script>
let ANIMS=[],COUNTERS=[],FILL=null,TOTAL=0;
const EASE='cubic-bezier(.22,1,.36,1)';
function mk(t,c,h){const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e}
function A(el,kf,at,dur,ease){
  const a=el.animate(kf,{delay:at*1000,duration:dur*1000,fill:'both',easing:ease||EASE});
  a.pause();ANIMS.push(a);return a;
}
const UP=[{opacity:0,transform:'translateY(28px)'},{opacity:1,transform:'translateY(0)'}];
const IN=[{opacity:0},{opacity:1}];
function count(el,from,to,at,dur,fmt){COUNTERS.push({el,from,to,at,dur,fmt:fmt||(v=>Math.round(v).toLocaleString())});}

function build(spec){
  const stage=document.getElementById('stage');
  stage.style.width=spec.width+'px';stage.style.height=spec.height+'px';
  document.body.style.width=spec.width+'px';document.body.style.height=spec.height+'px';
  if(spec.backdrop){const b=mk('div');b.id='backdrop';b.style.backgroundImage='url("'+spec.backdrop+'")';
    if(spec.backdropOpacity!=null)b.style.opacity=spec.backdropOpacity;stage.appendChild(b);}
  let t0=0;
  spec.scenes.forEach(sc=>{
    const dur=sc.dur, F=0.4, span=dur+2*F, s=mk('div','scene');
    stage.appendChild(s);
    if(sc.bg){
      const b=mk('div','bg');b.style.backgroundImage='url("'+sc.bg+'")';s.appendChild(b);
      s.appendChild(mk('div','scrim'));
      A(b,[{transform:'scale(1.04)'},{transform:'scale(1.12)'}],t0-F,dur+2*F,'linear');
    }
    const f=F/span;
    A(s,[{opacity:0,transform:'translateY(16px)',offset:0},
         {opacity:1,transform:'translateY(0)',offset:f},
         {opacity:1,transform:'translateY(0)',offset:1-f},
         {opacity:0,transform:'translateY(-16px)',offset:1}],t0-F,span,'ease-out');
    LAYOUT[sc.layout](s,sc,t0,dur);
    t0+=dur;
  });
  TOTAL=t0;
  const ft=mk('div');ft.id='footer';
  ft.appendChild(mk('div','',spec.brand.domain));
  ft.appendChild(mk('div','h',spec.brand.handle));
  stage.appendChild(ft);
  const tr=mk('div');tr.id='track';FILL=mk('div');FILL.id='fill';tr.appendChild(FILL);stage.appendChild(tr);
  return TOTAL;
}

const LAYOUT={
  title(s,sc,t0){
    let d=0.15;
    if(sc.eyebrow){const e=mk('div','eyebrow',sc.eyebrow);s.appendChild(e);A(e,UP,t0+d,.55);d+=.2}
    const h=mk('div','title'+(sc.small?' sm':''));s.appendChild(h);
    sc.lines.forEach(l=>{const r=mk('div','',l);h.appendChild(r);A(r,UP,t0+d,.6);d+=.22});
    if(sc.rule){const r=mk('div','rule');s.appendChild(r);
      A(r,[{transform:'scaleX(0)',transformOrigin:'left'},{transform:'scaleX(1)',transformOrigin:'left'}],t0+d,.5);d+=.15}
    if(sc.sub){const u=mk('div','sub',sc.sub);s.appendChild(u);A(u,UP,t0+d+.1,.6)}
  },
  stats(s,sc,t0){
    const h=mk('div','title sm',sc.title);s.appendChild(h);A(h,UP,t0+.15,.6);
    const p=mk('div','pair');s.appendChild(p);
    sc.cards.forEach((c,i)=>{
      const el=mk('div','card '+(i?'b':'a'));
      const v=mk('div','v','0');el.appendChild(v);el.appendChild(mk('div','l',c.label));
      p.appendChild(el);
      A(el,UP,t0+.7+i*.55,.6);
      const dp=c.decimals||0,pre=c.prefix||'',suf=c.suffix||'';
      count(v,0,c.value,t0+.8+i*.55,1.1,
        x=>pre+(dp?x.toFixed(dp):Math.round(x).toLocaleString())+suf);
    });
    if(sc.sub){const u=mk('div','sub',sc.sub);s.appendChild(u);A(u,UP,t0+2.1,.6)}
  },
  bars(s,sc,t0,dur){
    if(sc.eyebrow){const e=mk('div','eyebrow',sc.eyebrow);s.appendChild(e);A(e,UP,t0+.15,.5)}
    const h=mk('div','title sm',sc.title);s.appendChild(h);A(h,UP,t0+.3,.6);
    const w=mk('div','bars');s.appendChild(w);
    const n=sc.bars.length, step=Math.min(.09,(dur-2.2)/n);
    sc.bars.forEach((b,i)=>{
      const col=mk('div','bar');
      if(b.slab){
        const sl=mk('div','bseg slab');sl.style.height=(b.slab*100*b.h)+'%';col.appendChild(sl);
        const ba=mk('div','bseg base under');ba.style.height=((1-b.slab)*100*b.h)+'%';col.appendChild(ba);
        A(col,[{transform:'scaleY(0)',transformOrigin:'bottom',opacity:.4},{transform:'scaleY(1)',transformOrigin:'bottom',opacity:1}],t0+.9+i*step,.55);
      }else{
        const ba=mk('div','bseg base');ba.style.height=(b.h*100)+'%';col.appendChild(ba);
        A(col,[{transform:'scaleY(0)',transformOrigin:'bottom',opacity:.4},{transform:'scaleY(1)',transformOrigin:'bottom',opacity:1}],t0+.9+i*step,.55);
      }
      w.appendChild(col);
    });
    const ax=mk('div','axis');ax.appendChild(mk('div','',sc.xlabels[0]));ax.appendChild(mk('div','',sc.xlabels[1]));
    s.appendChild(ax);A(ax,IN,t0+.9+n*step,.5);
    if(sc.punch){const p=mk('div','punch',sc.punch);s.appendChild(p);A(p,UP,t0+Math.max(2.2,1.1+n*step),.6)}
  },
  formula(s,sc,t0){
    const h=mk('div','title sm',sc.title);s.appendChild(h);A(h,UP,t0+.15,.6);
    const f=mk('div','formula');f.style.marginTop='48px';s.appendChild(f);
    sc.parts.forEach((p,i)=>{const e=mk('div','tok '+(p.k||''),p.t);f.appendChild(e);A(e,UP,t0+.8+i*.28,.5)});
    if(sc.punch){const p=mk('div','punch',sc.punch);s.appendChild(p);A(p,UP,t0+.9+sc.parts.length*.28,.6)}
    if(sc.sub){const u=mk('div','sub',sc.sub);s.appendChild(u);A(u,UP,t0+1.3+sc.parts.length*.28,.6)}
  },
  list(s,sc,t0){
    if(sc.eyebrow){const e=mk('div','eyebrow',sc.eyebrow);s.appendChild(e);A(e,UP,t0+.15,.5)}
    const h=mk('div','title sm',sc.title);s.appendChild(h);A(h,UP,t0+.3,.6);
    sc.items.forEach((it,i)=>{
      const row=mk('div','item');
      row.appendChild(mk('div','num',String(i+1)));
      row.appendChild(mk('div','itext',it.t+(it.s?'<span>'+it.s+'</span>':'')));
      s.appendChild(row);A(row,UP,t0+1.0+i*.7,.6);
    });
  }
};

function seek(t){
  const ms=t*1000;
  ANIMS.forEach(a=>{a.currentTime=ms});
  COUNTERS.forEach(c=>{
    const p=Math.max(0,Math.min(1,(t-c.at)/c.dur));
    const e=1-Math.pow(1-p,3);
    c.el.textContent=c.fmt(c.from+(c.to-c.from)*e);
  });
  if(FILL)FILL.style.width=(100*Math.min(1,t/TOTAL))+'%';
}
window.build=build;window.seek=seek;
</script>
